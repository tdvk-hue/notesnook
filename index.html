<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Notes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: Notesnook web shell. Wide: nav | list | editor. Phone: one pane + nav drawer + full-screen editor.
   Colors come from Notesnook's own theme.json files (streetwriters/notesnook-themes). */
:root {
  --bg: #ffffff; --bg2: #f7f7f7; --fg: #505050; --heading: #202020; --muted: #777777;
  --border: #e8e8e8; --sep: #e8e8e8; --accent: #008837; --accentFg: #ffffff; --hover: #eeeeee; --accentInk: var(--accent); --accentInkInv: var(--accent);
  --selBg: #eeeeee; --selFg: #212121; --icon: #505050; --placeholder: #a9a9a9; --error: #f54b42;
  --font: "Inter", "Noto Sans", Frutiger, Calibri, Arial, Helvetica, -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: Hack, Consolas, "Liberation Mono", "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #181818; --bg2: #202020; --fg: #d3d3d3; --heading: #e3e3e3; --muted: #818589;
    --border: #2b2b2b; --sep: #383838; --accent: #008837; --accentFg: #ffffff; --hover: #2b2b2b;
    --selBg: #494949; --selFg: #fbfbfb; --icon: #808080; --placeholder: #404040; --error: #f54b42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #181818; --bg2: #202020; --fg: #d3d3d3; --heading: #e3e3e3; --muted: #818589;
  --border: #2b2b2b; --sep: #383838; --accent: #008837; --accentFg: #ffffff; --hover: #2b2b2b;
  --selBg: #494949; --selFg: #fbfbfb; --icon: #808080; --placeholder: #404040; --error: #f54b42;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45; overflow: hidden; }
button { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: var(--icon); }
:focus-visible { outline: 2px solid var(--heading); outline-offset: 2px; }  /* keyboard focus: neutral, so it never reads as "selected" */

.shell { display: grid; grid-template-columns: 276px minmax(260px, 340px) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100%; }
.nav, .list, .editor { min-height: 0; }
.nav { background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.navtop { display: flex; align-items: center; justify-content: space-between; min-height: 57px; padding: 0 8px 0 max(8px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--border); flex: none; }
.navtop .brand { padding: 4px 6px; }
.navtop .sp { flex: 1; }
.navtop [aria-current="page"] svg.i { fill: var(--accentInk); }
.navbody { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 8px 8px 12px max(8px, env(safe-area-inset-left, 0px)); overscroll-behavior: contain; }
.navempty { margin: 4px 10px; font-size: 13px; color: var(--muted); }
.navsec { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding-left: 4px; }
.seclink { flex: 1; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; color: var(--heading); padding: 7px 6px; border-radius: 6px; text-align: left; }
@media (hover: hover) { .seclink:hover { background: var(--hover); } }
.seclink[aria-current="page"] { background: var(--selBg); color: var(--selFg); }
.seclink .secn { font-weight: 400; font-size: 12px; color: var(--muted); }
.seclink svg.i { width: 16px; height: 16px; margin-left: auto; fill: var(--muted); }
.navsec .iconbtn { padding: 4px; }
.navsec .iconbtn svg.i { width: 17px; height: 17px; }
.navsep.thin { margin: 4px 10px; }
.navmore { border: 0; background: transparent; cursor: pointer; font: inherit; font-size: 13px; color: var(--accentInk); text-align: left; padding: 6px 10px 6px 38px; border-radius: 6px; }
@media (hover: hover) { .navmore:hover { background: var(--hover); } }
.navitem .mark { display: inline-flex; }
.navitem .mark svg.i { width: 13px; height: 13px; fill: var(--muted); }
.dock { flex: none; display: flex; justify-content: space-between; gap: 2px; border-top: 1px solid var(--border); padding: 6px 6px max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px)); }
.dock button { flex: 1 1 auto; display: grid; justify-items: center; gap: 3px; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 11px; padding: 7px 4px 5px; border-radius: 8px; cursor: pointer; min-width: 0; }
.dock button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (hover: hover) { .dock button:hover { background: var(--hover); } }
.dock button[aria-current="page"] { background: var(--selBg); color: var(--selFg); }
.dock button[aria-current="page"] svg.i { fill: var(--accentInk); }
.dock svg.i { width: 20px; height: 20px; }
.chev { display: inline-grid; place-items: center; margin: -4px; padding: 4px; border-radius: 6px; }
@media (hover: hover) { .chev:hover { background: var(--hover); } }
.navitem .offmark svg.i { width: 13px; height: 13px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 6px 10px 12px; font-weight: 600; color: var(--heading); font-size: 16px; white-space: nowrap; }
.brand .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accentFg); font-size: 12px; font-weight: 700; }
.navitem { -webkit-touch-callout: none; user-select: none; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; border: 0; background: transparent; cursor: pointer; text-align: left; width: 100%; color: var(--fg); }
@media (hover: hover) { .navitem:hover { background: var(--hover); } }
.navitem[aria-current="page"] { background: var(--selBg); color: var(--selFg); font-weight: 500; }
.navitem[aria-current="page"] svg.i { fill: var(--accentInk); }
.navitem .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navitem .n { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.navsep { height: 1px; background: var(--border); margin: 8px 6px; }
.navhead { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 4px 10px; }

.list { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.listhead { padding: 8px 14px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--border); }
.titlerow { display: flex; align-items: center; gap: 8px; min-width: 0; min-height: 40px; }
.titlerow h1 { margin: 0; font-size: 20px; font-weight: 600; color: var(--heading); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { border: 0; background: transparent; padding: 6px; border-radius: 6px; cursor: pointer; display: inline-grid; place-items: center; }
@media (hover: hover) { .iconbtn:hover { background: var(--hover); } }
.menubtn { display: none; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
.search input { border: 0; outline: 0; background: transparent; color: var(--fg); font: inherit; flex: 1; min-width: 0; }
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: var(--muted); opacity: .8; }
.search .iconbtn { padding: 2px; margin: -2px -4px -2px 0; }
.search .iconbtn svg.i { width: 16px; height: 16px; }
.titlerow [aria-pressed="true"] svg.i { fill: var(--accentInk); }
.subline { font-size: 12px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg2); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
.pill.on { color: var(--accentInk); border-color: var(--accentInk); }
.items { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 90px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.group { font-size: 12px; font-weight: 600; color: var(--accentInk); padding: 12px 14px 4px; }
.note { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 6px; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
@media (hover: hover) { .note:hover { background: var(--hover); } }
.note.active { background: var(--selBg); box-shadow: inset 3px 0 0 var(--accentInk); }
.note h3 { margin: 0; font-size: 14px; font-weight: 600; color: var(--heading); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.note .pv { grid-column: 1 / -1; color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.note .meta { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.note .meta svg.i { width: 13px; height: 13px; }
.nbtag { display: inline-flex; align-items: center; gap: 3px; }
.nbtag.hash { color: var(--muted); }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }
.emptyacts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 12px; }
.empty b { display: block; color: var(--heading); font-size: 16px; margin-bottom: 4px; }

.nbrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
@media (hover: hover) { .nbrow:hover { background: var(--hover); } }
.nbrow.virtual { background: var(--bg2); }
.defn { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.defn .linkbtn { padding: 3px 0; font-size: 13px; }
.defn > span { display: inline-flex; align-items: center; gap: 6px; }
.defn .defico { width: 15px; height: 15px; fill: var(--accentInk); }
@media (max-width: 680px) { .titlerow h1.long { font-size: 18px; } }
.titlerow h1.long { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.2; }
.homebadge { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; color: var(--muted); padding: 2px 4px 2px 0; }
.homebadge svg.i { width: 13px; height: 13px; fill: var(--accentInk); }
.navitem .homemark svg.i { fill: var(--accentInk); }
.homestatus { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; color: var(--accentInk); font: inherit; font-size: 13px; padding: 2px 0; cursor: pointer; }
.homestatus svg.i { width: 15px; height: 15px; fill: var(--accentInk); }
.homestatus .stchev { display: inline-flex; margin-left: -2px; }
.homestatus .stchev svg.i { width: 14px; height: 14px; }
.subline .homebadge + .homestatus { margin-left: 6px; }
.homemark svg.i, .offmark.homemark svg.i { fill: var(--accentInk); }
@media (hover: hover) { .homestatus:hover span { text-decoration: underline; } }
.defn .editbtn { padding: 3px; }
.defn .editbtn svg.i { width: 16px; height: 16px; }
.xchip { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; border: 1px solid var(--border); background: var(--bg2); color: var(--fg); font: inherit; font-size: 12px; padding: 3px 6px 3px 8px; border-radius: 999px; cursor: pointer; }
.xchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xchip svg.i { width: 13px; height: 13px; }
.xchip svg.i:last-child { fill: var(--muted); }
@media (hover: hover) { .xchip:hover { border-color: var(--error); } }
@media (hover: hover) { .xchip:hover svg.i:last-child { fill: var(--error); } }
.xchip.more { padding-right: 8px; color: var(--muted); }
.cust p { margin: 0 0 6px; }
.cust .custnote { font-size: 12px; margin: -2px 0 6px; }
.custlist + .custhead { margin-top: 10px; }
.sheet .custlist { max-height: none; }
.custhead { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 0 4px; }
.custlist { max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--border); }
.custfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
.custfoot .sp { flex: 1; }
.custfoot .muted { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
.custfoot .muted svg.i { width: 15px; height: 15px; }
.lphead { display: flex; align-items: center; gap: 6px; padding: 0 4px 8px; font-size: 16px; font-weight: 600; color: var(--heading); }
.lphead .sp { flex: 1; }
.lpbody .connrow { padding: 10px 4px 10px 8px; }
.lpadd { margin-top: 8px; }
.hubbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--selBg); color: var(--selFg); font-weight: 600; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); background: transparent; color: var(--fg); font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.fchip span { color: var(--muted); font-variant-numeric: tabular-nums; }
.fchip[aria-pressed="true"] { border-color: var(--accentInk); color: var(--accentInk); }
.fchip[aria-pressed="true"] span { color: var(--accentInk); }
.hubnote { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 14px; font-size: 13px; color: var(--muted); background: var(--bg2); border-bottom: 1px solid var(--border); }
.chevbtn { padding: 0; margin: -4px 0 -4px 2px; vertical-align: middle; min-width: 0 !important; min-height: 0 !important; width: 32px; height: 28px; }
.chevbtn svg.i { width: 18px; height: 18px; }
.listsep { font-size: 12px; font-weight: 600; color: var(--accentInk); padding: 12px 14px 4px; }
.nbrow.virtual .t { font-weight: 500; }
.filebtn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 4px; border-radius: 6px; border: 0; color: var(--muted); background: transparent; cursor: pointer; }
.filebtn svg.i { width: 13px; height: 13px; fill: var(--muted); }
.nbrow .t { font-weight: 600; color: var(--heading); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbrow .d { grid-column: 2; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbrow .more { grid-row: 1 / span 2; grid-column: 3; }
.homechip { display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; padding: 4px 10px 4px 8px; border-radius: 999px; cursor: pointer; border: 1px solid var(--border); background: var(--bg2); color: var(--muted); }
.homechip svg.i { width: 14px; height: 14px; fill: var(--muted); }
.homechip.on { border-color: var(--accentInk); color: var(--accentInk); }
.homechip.on svg.i { fill: var(--accentInk); }
@media (hover: hover) { .homechip:hover { background: var(--hover); } }
.chipx { margin-left: 4px; padding-left: 6px; border-left: 1px solid var(--border); color: var(--accentInk); font-weight: 600; }
.offmark { display: inline-flex; align-items: center; gap: 3px; color: var(--muted); }
.offmark svg.i { width: 13px; height: 13px; }
.offmark.why { gap: 4px; }
.edhidden { display: flex; align-items: center; gap: 6px; margin: -2px 0 0; font-size: 13px; color: var(--muted); }
.edhidden svg.i { width: 15px; height: 15px; fill: var(--muted); }
.nbrow .ico { grid-row: 1 / span 2; }

.fab { position: absolute; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 48px; height: 48px; border-radius: 14px; border: 0; background: var(--accent); color: var(--accentFg); display: grid; place-items: center; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.fab svg.i { fill: var(--accentFg); width: 24px; height: 24px; }
.listwrap { position: relative; display: flex; flex-direction: column; min-height: 0; height: 100%; }
.listhead { flex: none; }

.editor { display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.edbar { display: flex; align-items: center; gap: 2px; min-height: 57px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.edbar .sp { flex: 1; }
.fmtbar { flex: none; display: flex; align-items: center; gap: 2px; border-top: 1px solid var(--border); background: var(--bg); padding: 6px max(10px, env(safe-area-inset-left, 0px)) max(6px, env(safe-area-inset-bottom, 0px)); overflow-x: auto; }
.fmtbar .iconbtn svg.i { width: 20px; height: 20px; }
.trashbar { justify-content: center; gap: 10px; font-size: 13px; color: var(--muted); padding-block: 10px; }
button.chip { font: inherit; font-size: 12px; }
button.chip.add { border-style: dashed; padding: 3px 8px; }
button.chip.add svg.i { width: 15px; height: 15px; fill: var(--accentInk); }
/* an empty slot: quiet, but in its place; it opens its picker */
.chip.empty { background: transparent; border-style: dashed; color: var(--muted); }
.chip.empty svg.i { fill: var(--muted); }
.eddate { font-size: 12px; color: var(--muted); margin-top: -4px; }
.backbtn { display: none; }
.edscroll { overflow-y: auto; flex: 1; min-height: 0; }
.edinner { max-width: 760px; margin: 0 auto; padding: 22px 28px 120px; display: grid; gap: 10px; }
.edtitle { font: inherit; font-size: 26px; font-weight: 600; line-height: 1.25; color: var(--heading); border: 0; outline: 0; background: transparent; width: 100%; padding: 0; resize: none; overflow: hidden; display: block; field-sizing: content; }
.edtitle::placeholder { color: var(--muted); opacity: .8; }
.edmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 9px; border-radius: 999px; max-width: 70%; white-space: nowrap; background: var(--bg2); border: 1px solid var(--border); color: var(--fg); cursor: pointer; }
.chip svg.i { width: 13px; height: 13px; }
.chip .cl, .nbtag .cl { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbtag { max-width: 170px; min-width: 0; }
.chip .mark, .checkrow .mark { display: inline-flex; margin-left: 2px; }
.chip .mark svg.i, .checkrow .mark svg.i { fill: var(--muted); }
.chip.add { color: var(--accentInk); }
.edbody { outline: 0; min-height: 50vh; font-size: var(--note-size, 15px); line-height: 1.6; color: var(--fg); overflow-wrap: anywhere; }
.edbody:empty::before { content: "Start writing your note..."; color: var(--muted); opacity: .8; }
.edbody h2 { color: var(--heading); font-size: 19px; margin: 1em 0 .4em; }
.edbody ul, .edbody ol { padding-left: 1.4em; }
.conns { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 12px; display: grid; gap: 4px; }
.connhead { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.connhead .sp { flex: 1; }
.linkbtn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--accentInk); font: inherit; font-size: 13px; font-weight: 500; text-transform: none; letter-spacing: 0; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
@media (hover: hover) { .linkbtn:hover { background: var(--hover); } }
.linkbtn svg.i { width: 16px; height: 16px; fill: var(--accentInk); }
.connrow, .connpick { display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 8px; border-radius: 6px; cursor: pointer; min-width: 0; }
.connpick { width: 100%; border: 0; background: transparent; text-align: left; font: inherit; color: var(--fg); padding: 9px 8px; border-bottom: 1px solid var(--border); border-radius: 0; }
@media (hover: hover) { .connrow:hover, .connpick:hover { background: var(--hover); } }
.connrow svg.i, .connpick svg.i { width: 16px; height: 16px; }
.ct { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--heading); font-size: 14px; }
.cn { font-size: 12px; color: var(--muted); flex: none; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.connrow .iconbtn svg.i { width: 15px; height: 15px; }
.connempty { margin: 2px 0; font-size: 13px; color: var(--muted); }
.connlist { max-height: 46vh; overflow-y: auto; border-top: 1px solid var(--border); }

    if (t && t.selFg === t.accent) root.style.setProperty("--selFg", tuneTo(tn.fill, [tn.selBg], 4.6));
    // themes that colour their icons with the accent: icons follow your accent too
    if (st.accent && t && t.icon && t.icon.toLowerCase() === t.accent.toLowerCase()) root.style.setProperty("--icon", tn.ink);
  } else {
    const cs = getComputedStyle(root), v = (k) => cs.getPropertyValue("--" + k).trim(), acc = v("accent");
    // its text tones still have to read, and the icon on its fill has to be visible
    root.style.setProperty("--accentInk", tuneTo(tuneTo(acc, [v("bg"), v("bg2")], 4.6), [v("selBg")], 3.1));
    root.style.setProperty("--accentInkInv", tuneTo(acc, [v("heading")], 4.5));
    root.style.setProperty("--accentFg", [v("accentFg"), "#ffffff", "#111111"].sort((a, b) => OK.contrast(b, acc) - OK.contrast(a, acc))[0]);
  }
  root.style.setProperty("--note-size", { s: "13px", m: "15px", l: "18px" }[st.noteSize || "m"]);
}

function setView(view, notebookId = null) {

function startMark(key) { return startScreen() === key ? `<span class="mark homemark" title="Homepage">${ic("home")}</span>` : ""; }

// Item menus (long-press, a row's ⋮, or the ⋮ in that page's header) are the same menu for the same item.

// Tiles first, in a fixed order: Set as homepage | Pin | Hide from All notes. Homepage is always first, so it is
// always in the same place. A tile says the action when off ("Pin") and the state when on ("Pinned").
// Toggles report with a toast; anything that moves or removes something offers Undo; anything permanent asks first.
function homepageTile(key) {

    ...db.tags.slice().sort((a, b) => a.title.localeCompare(b.title)).map((t) => ["tag:" + t.id, "#" + t.title, "tag", 0, hiddenTag(t)])];
}
function chooseHomepage() {

    <div class="connlist">${homepageChoices().map(([k, l, icon, depth, hid]) => `<label class="checkrow ${depth ? "child" : ""}"><input type="radio" name="hp" value="${k}" ${startScreen() === k ? "checked" : ""}>${ic(icon)}<span>${esc(l)}</span>${hid ? `<span class="mark" title="${hideLabel(true)}">${ic("eyeoff")}</span>` : ""}</label>`).join("")}</div>`, (o, close) => {

}
function pinTile(obj, noun) {

}
function hideTile(b) {

function pageTiles({ pinObj, pinNoun, hideNb, hideTag, homeKey }) {
  return [homepageTile(homeKey), pinObj ? pinTile(pinObj, pinNoun) : null,
    homeOn() && hideNb ? hideTile(hideNb) : null, homeOn() && hideTag ? tagHideTile(hideTag) : null].filter(Boolean);
}
const ROUTE_NAMES = () => ({ home: homeLabel(), favorites: "Favorites", unfiled: "Notes without a notebook" });
function routeItems(id) {

    <div class="navbody" id="navBody">

      ${navItem("favorites", "Favorites", "star", live.filter((n) => n.favorite && !n.archived).length, ui.view === "favorites")}

      <div class="navsec"><button class="seclink" data-nav="notebooks" ${ui.view === "notebooks" ? 'aria-current="page"' : ""} aria-label="Open all notebooks">Notebooks<span class="secn">${db.notebooks.length}</span>${ic("chev")}</button><button class="iconbtn" id="addNbNav" aria-label="New notebook">${ic("plus")}</button></div>
      <button class="navitem" data-nav="unfiled" ${ui.view === "unfiled" ? 'aria-current="page"' : ""}>${ic("unfiled")}<span class="label">Notes without a notebook</span>${startMark("unfiled")}<span class="n">${unfiledNotes().length}</span></button>

function bindMenuGesture(el, open) {
  el.addEventListener("contextmenu", (e) => { e.preventDefault(); if (Date.now() - (el._heldAt || 0) < 900) return; ui.menuAt = e.pointerType === "touch" ? null : { x: e.clientX, y: e.clientY }; open(); ui.menuAt = null; });
  longPress(el, () => { el._heldAt = Date.now(); open(); });
}
// Hold an item to open its menu, like the Android app
function longPress(el, run) {
  let t = null;
  const cancel = () => { clearTimeout(t); t = null; };
  el.addEventListener("pointerdown", (e) => { delete el.dataset.held; if (e.pointerType !== "touch") return; cancel(); t = setTimeout(() => { t = null; el.dataset.held = "1"; run(); setTimeout(() => delete el.dataset.held, 800); }, 480); });
  ["pointerup", "pointercancel", "pointerleave", "pointermove"].forEach((ev) => el.addEventListener(ev, (e) => { if (ev === "pointermove" && Math.abs(e.movementY) < 4) return; cancel(); }));
}
function currentScheme() {
  const t = activeTheme();
  if (t) return t.scheme;
  const forced = document.documentElement.dataset.theme;
  if (forced === "dark" || forced === "light") return forced;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function noteRow(n, inPinnedGroup = false) {

  return `<div class="note ${ui.noteId === n.id ? "active" : ""}" data-note="${n.id}" role="button" tabindex="0">

      ${connectedIds(n).length ? `<span class="nbtag" title="${plural(connectedIds(n).length, "linked note")}">${ic("link")}${connectedIds(n).length}</span>` : ""}
      ${offNotes(n) ? (ui.view === "hidden" ? `<span class="offmark why">${ic("eyeoff")}${esc(hiddenReason(n))}</span>` : `<span class="offmark" title="Not on All notes: ${esc(hiddenReason(n))}">${ic("eyeoff")}</span>`) : ""}
      ${ui.view === "unfiled" && !n.trashed ? `<button class="filebtn" data-file="${n.id}">${ic("addnb")}Add to notebook</button>` : ""}
    </div>
  </div>`;
}
function grouped(notes, withPinned = true) {
  const sorted = [...notes].sort((a, b) => b.edited - a.edited);
  let html = "";
  const pinned = withPinned ? sorted.filter((n) => n.pinned) : [];
  const rest = withPinned ? sorted.filter((n) => !n.pinned) : sorted;
  if (pinned.length) html += `<div class="group">Pinned</div>` + pinned.map((n) => noteRow(n, true)).join("");
  let last = null;
  rest.forEach((n) => { const g = groupOf(n.edited); if (g !== last) { html += `<div class="group">${g}</div>`; last = g; } html += noteRow(n); });
  return html;
}
function matches(n, q) { q = q.toLowerCase(); return (n.title + " " + preview(n.html) + " " + n.tags.map((t) => "#" + (tagById(t)?.title || "")).join(" ")).toLowerCase().includes(q); }

// The homepage says what it is: all notes, minus the notebooks you left out. Each exclusion is a chip you can remove.
function homeDefinition() {

  const what = hiddenSummary();
  if (!what) return "";
  return `<button class="homestatus" data-customize aria-label="Choose what's hidden">${ic("eyeoff")}<span>${what} hidden</span><span class="stchev">${ic("chev")}</span></button>`;
}

      ${tags.length ? `<div class="custhead">Tags</div><p class="custnote">A note with any hidden tag stays off All notes.</p>

function renderList() {

  if (ui.view === "home") {
    title = homeLabel();
    const shown = homepageNotes();
    const hiddenCount = live.filter((n) => !n.archived && !onHomepage(n)).length;
    if (q) {
      // search on the homepage searches every note, like the real app
      const res = live.filter((n) => !n.archived && matches(n, q));

        ? `<div class="empty"><b>Nothing to show</b>All ${plural(hiddenCount, "note")} are hidden from All notes.<div class="emptyacts"><button class="btn" data-go-hidden>See hidden notes</button><button class="btn" data-customize>Choose what's hidden</button></div></div>`

    }

  } else if (ui.view === "hidden") {

    let res = liveNotes().filter((n) => !n.archived && !onHomepage(n)); if (q) res = res.filter((n) => matches(n, q));
    const names = hidden.map((b) => esc(b.title));
    sub = hidden.length
      ? `<div class="defn"><span>From ${names.length > 1 ? names.slice(0, -1).join(", ") + " and " + names[names.length - 1] : names[0]}</span><button class="linkbtn" data-customize>${ic("edit")}Change</button></div>`

      : `<div class="empty"><b>Nothing is hidden</b>Every note shows on ${homeLabel()}.<br><button class="btn" data-go="home" style="margin-top:12px">Back to ${homeLabel()}</button></div>`;
  } else if (ui.view === "tag") {
    const t = tagById(ui.tagId);

    let res = tagNotes(t.id); if (q) res = res.filter((n) => matches(n, q));

    title = "Favorites";

    body = res.length ? grouped(res) : `<div class="empty"><b>No favorites</b>Mark a note as favorite from its menu.</div>`;
  } else if (ui.view === "archive") {

    sub = hubControls([["used", "Most used"], ["az", "A–Z"]], db.settings.tagSort === "az" ? "az" : "used", "tagSort",
      [["all", "All", db.tags.length], ["pinned", "Pinned", nPinned], ...(homeOn() ? [["hidden", "Hidden", db.tags.filter(hiddenTag).length]] : []), ["unused", "Unused", nUnused]]);
    const ql = q.toLowerCase().replace(/^#/, "");
    const list = db.tags.filter((t) => (!q || t.title.includes(ql)) && (ui.hubFilter !== "pinned" || t.pinned) && (ui.hubFilter !== "hidden" || hiddenTag(t)) && (ui.hubFilter !== "unused" || tagUsage(t.id) === 0));
    const row = (t) => `<div class="nbrow" data-open-tag="${t.id}" role="button" tabindex="0"><span class="ico">${ic("tag")}</span><span class="t">${esc(t.title)}</span><button class="iconbtn more" data-tagmore="${t.id}" aria-label="Tag options">${ic("more")}</button><span class="d">${startScreen() === "tag:" + t.id ? `<span class="offmark homemark" title="Homepage">${ic("home")}</span> ` : ""}${t.pinned && (q || ui.hubFilter !== "all") ? `<span class="offmark">${ic("pinout")}</span> ` : ""}${hiddenTag(t) ? `<span class="offmark" title="${hideLabel(true)}">${ic("eyeoff")}</span> ` : ""}${plural(tagNotes(t.id).length, "note")}</span></div>`;

      : `<div class="empty"><b>${q ? "No tags match" : ui.hubFilter === "pinned" ? "No pinned tags" : ui.hubFilter === "unused" ? "No unused tags" : ui.hubFilter === "hidden" ? "No hidden tags" : "No tags yet"}</b>${!q && ui.hubFilter === "all" ? "Tap + to create one, or add tags from a note." : ""}</div>`);

    const subRows = subs.length && !q ? `<div class="listsep">Sub-notebooks</div>` + subs.map((c) => `<div class="nbrow" data-open-nb="${c.id}" role="button" tabindex="0"><span class="ico">${ic("sub")}</span><span class="t">${esc(c.title)}</span><button class="iconbtn more" data-nbmore="${c.id}" aria-label="Notebook options">${ic("more")}</button><span class="d">${hiddenNb(c) ? `<span class="offmark" title="${hideLabel(true)}">${ic("eyeoff")}</span> ` : ""}${plural(countIn(c.id), "note")}</span></div>`).join("") : "";
    body = subRows + (res.length ? grouped(res) : `<div class="empty"><b>No notes in ${esc(b.title)}</b>Tap + to add one.</div>`);
  } else if (ui.view === "settings") {

  }

  // When another page is the homepage, the curated list says what it is

    sub = `<span class="homebadge">${ic("home")}Homepage</span>` + sub;
  const isHub = ui.view === "notebooks" || ui.view === "tags";

        ${ui.view === "tag" ? `<button class="iconbtn" data-tagmore="${ui.tagId}" aria-label="Tag options">${ic("more")}</button>` : ""}

  const sb = wrap.querySelector("#searchBtn");
  if (sb) sb.onclick = () => { ui.searchOpen = !(ui.searchOpen || ui.query); ui.query = ""; renderList(); if (ui.searchOpen) document.getElementById("searchInput")?.focus(); };
  const sc = wrap.querySelector("#searchClose");
  if (sc) sc.onclick = (e) => { e.preventDefault(); ui.searchOpen = false; ui.query = ""; renderList(); };
  wrap.querySelectorAll("[data-sort]").forEach((b) => b.onclick = () => { const [k, v] = b.dataset.sort.split(":"); db.settings[k] = v === "az" ? "az" : "recent"; save(); renderList(); });
  wrap.querySelectorAll("[data-filter]").forEach((b) => b.onclick = () => { ui.hubFilter = b.dataset.filter; renderList(); });
  wrap.querySelectorAll("[data-expand]").forEach((c) => c.onclick = (e) => { e.stopPropagation(); const id = c.dataset.expand; ui.expanded.has(id) ? ui.expanded.delete(id) : ui.expanded.add(id); renderList(); });
  wrap.querySelectorAll("[data-clean-tags]").forEach((b) => b.onclick = () => {

    confirmDialog(`Delete ${plural(unused.length, "unused tag")}?`, "These tags are not on any note.", "Delete", () => { const ids = new Set(unused.map((t) => t.id)); db.tags = db.tags.filter((t) => !ids.has(t.id)); commit(`${plural(unused.length, "tag")} deleted`); });

function themeCard(t, selected) {
  return `<button class="themecard" data-theme-id="${t ? t.id : ""}" aria-pressed="${selected}">
    <div class="sw" style="background:${t ? t.bg : "linear-gradient(90deg,#fff 50%,#181818 50%)"}"><i style="background:${t ? t.bg2 : "linear-gradient(90deg,#f7f7f7 50%,#202020 50%)"}"></i><div class="p"><span style="background:${t ? t.heading : "#888"};width:70%"></span><span style="background:${t ? t.fg : "#888"};width:90%;opacity:.6"></span><span style="background:${t ? t.accent : "#008837"};width:40%"></span></div></div>
    <div class="nm">${t ? esc(t.name) : "Default"}</div></button>`;
}
function themePicker() {
  const community = THEMES.filter((t) => !t.id.startsWith("default-"));
  const draw = (w) => {
    const cur = db.settings.theme;
    w.querySelector(".tpbody").innerHTML = `
      <h2 class="ptitle">Themes</h2>
      <p class="tphint">Pick a full theme. Your accent color still applies on top${db.settings.accent ? "" : " if you choose one"}.</p>
      <div class="themes">${themeCard(null, !cur)}</div>
      <div class="custhead">Dark</div><div class="themes">${community.filter((t) => t.scheme === "dark").map((t) => themeCard(t, cur === t.id)).join("")}</div>
      <div class="custhead">Light</div><div class="themes">${community.filter((t) => t.scheme === "light").map((t) => themeCard(t, cur === t.id)).join("")}</div>
      <div class="actions"><button class="btn primary" data-x>Done</button></div>`;
    w.querySelector("[data-x]").onclick = () => w.remove();
    w.querySelectorAll("[data-theme-id]").forEach((b) => b.onclick = () => {
      db.settings.theme = b.dataset.themeId || null; applyTheme(); save(); render(); draw(w);
    });
  };
  panel("Themes", `<div class="tpbody"></div>`, (w) => draw(w));
}

// Sheet on phones, dialog on wide screens
function panel(title, html, onReady) {

  const w = document.createElement("div");
  w.className = phone ? "sheetwrap" : "overlay";
  w.innerHTML = phone ? `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div>${html}</div>`
    : `<div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}">${html}</div>`;
  const close = () => w.remove();
  // backdrop, Escape, swipe and Back all close it the same way as its own button
  const dismiss = () => { if (w.onPanelClose) { const f = w.onPanelClose; w.onPanelClose = null; f(); } else close(); };
  w.addEventListener("click", (e) => { if (e.target === w) dismiss(); });

  w._dismiss = dismiss;
  document.body.appendChild(w);
  if (phone) swipeToClose(w.querySelector(".sheet"), dismiss);
  onReady(w, close);
  if (!phone) setTimeout(() => w.querySelector("button")?.focus(), 30); // keyboard users on desktop; no stray focus ring on phone
}
function linkedPanel(id) {

const cleanTag = (v) => v.trim().replace(/^#+/, "").replace(/\s+/g, "-").toLowerCase();
function editTag(id) {
  const t = id ? tagById(id) : null;
  dialog(`<h2>${t ? "Edit tag" : "New tag"}</h2>
    <label class="field">Name<input id="tagName" value="${esc(t?.title || "")}" placeholder="e.g. research"></label>
    ${homeOn() ? `<div class="setrow"><div><b>${hideLabel()}</b><p>Notes with this tag stay off All notes. You still find them under the tag and in search.</p></div><label class="switch"><input type="checkbox" id="tagHide" ${t?.hidden ? "checked" : ""} aria-label="${hideLabel()}"><span></span></label></div>` : ""}
    <div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>${t ? "Save" : "Create"}</button></div>`, (o, close) => {
    const submit = () => {
      const v = cleanTag(o.querySelector("#tagName").value);

      const hideChanged = t && !!t.hidden !== hidden;
      if (t) { t.title = v; t.hidden = hidden; } else db.tags.push({ id: uid(), title: v, hidden });
      close(); commit(t ? (hideChanged ? `Tag saved. ${hidden ? hideLabel(true) : "Back on All notes"}` : "Tag saved") : `#${v} created`);

}
function pickTags(noteId) {
  const n = db.notes.find((x) => x.id === noteId);
  const wasOn = onHomepage(n), prevTags = n.tags.slice();
  panel("Add tags", `<h2 class="ptitle">Add tags</h2>
    ${homeOn() && db.tags.some((t) => t.hidden) ? `<p class="phint">A note with any hidden tag stays off All notes.</p>` : ""}
    <label class="search">${ic("tag")}<input id="tagNew" placeholder="Add or find a tag" autocomplete="off"></label>
    <div id="tagList" class="connlist"></div>
    <div class="actions"><button class="btn primary" data-x>Done</button></div>`, (o, close) => {
    const list = o.querySelector("#tagList"), inp = o.querySelector("#tagNew");
    const draw = () => {
      const v = cleanTag(inp.value);
      const tags = db.tags.filter((t) => !v || t.title.includes(v)).sort((a, b) => a.title.localeCompare(b.title));
      const exact = db.tags.some((t) => t.title === v);
      list.innerHTML = (v && !exact ? `<button class="connpick" data-create>${ic("plus")}<span class="ct">Create #${esc(v)}</span></button>` : "") +
        tags.map((t) => `<label class="checkrow"><input type="checkbox" value="${t.id}" ${n.tags.includes(t.id) ? "checked" : ""}>${ic("tag")}<span>${esc(t.title)}</span>${hiddenTag(t) ? `<span class="mark" title="${hideLabel(true)}">${ic("eyeoff")}</span>` : ""}</label>`).join("");
      list.querySelectorAll("input[type=checkbox]").forEach((c) => c.onchange = () => {
        n.tags = c.checked ? [...n.tags, c.value] : n.tags.filter((x) => x !== c.value); save(); render();
      });
      const cr = list.querySelector("[data-create]");
      if (cr) cr.onclick = () => { const t = { id: uid(), title: v }; db.tags.push(t); n.tags.push(t.id); inp.value = ""; save(); render(); draw(); };
    };
    inp.oninput = draw;
    inp.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); list.querySelector("[data-create]")?.click(); } };
    draw();
    const done = () => { close(); if (wasOn && offNotes(n)) toast(`${hiddenReason(n)}, so this note is off All notes`, { label: "Undo", run: () => { n.tags = n.tags.filter((id) => !tagById(id)?.hidden || prevTags.includes(id)); commit(); } }); };
    o.querySelector("[data-x]").onclick = done; o.onPanelClose = done;
  });
}
function connectDialog(id) {
  const n = db.notes.find((x) => x.id === id);
  const already = new Set(connectedIds(n));
  const candidates = () => liveNotes().filter((o) => o.id !== id && !already.has(o.id));
  panel("Link note", `<h2 class="ptitle">Link note</h2>
    <label class="search">${ic("search")}<input id="connQ" type="search" placeholder="Search notes" autocomplete="off"></label>
    <div id="connList" class="connlist"></div>
    <div class="actions"><button class="btn primary" data-x>Done</button></div>`, (o, close) => {
    const list = o.querySelector("#connList"), q = o.querySelector("#connQ");
    const draw = () => {
      const v = q.value.trim().toLowerCase();
      const res = candidates().filter((c) => !v || (c.title + " " + preview(c.html)).toLowerCase().includes(v)).sort((a, b) => b.edited - a.edited).slice(0, 40);
      list.innerHTML = res.map((c) => { const nb = c.notebooks.map(notebook).filter(Boolean)[0];
        return `<button class="connpick" data-pick="${c.id}">${ic("note")}<span class="ct">${esc(c.title || "Untitled")}</span>${nb ? `<span class="cn">${esc(nb.title)}</span>` : ""}</button>`; }).join("") || `<p class="connempty">No matching notes.</p>`;
      list.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => {
        const other = b.dataset.pick; connect(id, other); close(); commit();
        const t = db.notes.find((x) => x.id === other);
        toast(`Linked to ${t.title || "Untitled"}`, { label: "Undo", run: () => { disconnect(id, other); commit(); } });

    q.oninput = draw; draw();
    o.querySelector("[data-x]").onclick = close;

}
const MAP_HUES = [211, 280, 45, 190, 320, 245, 75, 300]; // no red (reads as error), no green (the default accent)
function nbColor(n) {
  const nb = n.notebooks.map(notebook).filter(Boolean)[0];
  if (!nb) return "var(--muted)";
  const i = db.notebooks.findIndex((b) => b.id === nb.id);
  return `hsl(${MAP_HUES[i % MAP_HUES.length]} 55% 50%)`;
}
function showMap(centerId) {
  closeMap();
  const o = document.createElement("div"); o.className = "mapview"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "Note map");
  document.body.appendChild(o);
  const draw = (cid) => {
    const c = db.notes.find((x) => x.id === cid); if (!c) return closeMap();
    const ring1 = connectedIds(c);
    const ring2 = [];
    ring1.forEach((id) => connectedIds(db.notes.find((x) => x.id === id)).forEach((j) => { if (j !== cid && !ring1.includes(j) && !ring2.some((r) => r.id === j)) ring2.push({ id: j, parent: id }); }));
    const W = 360, H = 360, cx = 180, cy = 180, r1 = 105, r2 = 160;
    const pos = { [cid]: [cx, cy] };
    ring1.forEach((id, i) => { const a = -Math.PI / 2 + (ring1.length === 2 ? Math.PI / 4 : 0) + (i / Math.max(ring1.length, 1)) * Math.PI * 2; pos[id] = [cx + r1 * Math.cos(a), cy + r1 * Math.sin(a)]; });
    const byParent = {};
    ring2.forEach((r) => (byParent[r.parent] = byParent[r.parent] || []).push(r.id));
    Object.entries(byParent).forEach(([pid, kids]) => {
      const pa = Math.atan2(pos[pid][1] - cy, pos[pid][0] - cx);
      kids.forEach((k, i) => { const a = pa + (i - (kids.length - 1) / 2) * 0.42; pos[k] = [cx + r2 * Math.cos(a), cy + r2 * Math.sin(a)]; });
    });
    const all = [cid, ...ring1, ...ring2.map((r) => r.id)];
    const edges = [];
    all.forEach((a) => connectedIds(db.notes.find((x) => x.id === a)).forEach((b) => { if (pos[b] && a < b) edges.push([a, b]); }));
    const label = (t) => { t = t || "Untitled"; return t.length > 18 ? t.slice(0, 17) + "…" : t; };
    const node = (id) => {
      const n = db.notes.find((x) => x.id === id), [x, y] = pos[id];
      const lvl = id === cid ? 0 : ring1.includes(id) ? 1 : 2;
      const r = lvl === 0 ? 11 : lvl === 1 ? 8 : 6;
      return `<g class="mnode lvl${lvl}" data-node="${id}" tabindex="0" role="button" aria-label="${esc(n.title || "Untitled")}">
        <circle cx="${x}" cy="${y}" r="${r + 10}" fill="transparent"/>
        <circle cx="${x}" cy="${y}" r="${r}" style="fill:${nbColor(n)}"/>
        <text x="${x}" y="${y + r + 14}" text-anchor="middle">${esc(label(n.title))}</text></g>`;
    };
    const nbs = [...new Set(all.map((id) => db.notes.find((x) => x.id === id).notebooks.map(notebook).filter(Boolean)[0]?.id || ""))];
    o.innerHTML = `<div class="maphead">
        <button class="iconbtn" id="mapClose" aria-label="Back">${ic("back")}</button>
        <h2>${esc(c.title || "Untitled")}</h2>
        ${cid === ui.noteId ? "" : `<button class="linkbtn" id="mapOpen">${ic("open")}Open</button>`}</div>
      <p class="maphint">${ring1.length ? "Tap a note to centre the map on it." : "This note has no linked notes yet."}</p>
      <div class="mapwrap"><svg viewBox="-20 -10 ${W + 40} ${H + 30}" role="img" aria-label="Map of linked notes">
        ${edges.map(([a, b]) => `<line class="medge ${a === cid || b === cid ? "e1" : ""}" x1="${pos[a][0]}" y1="${pos[a][1]}" x2="${pos[b][0]}" y2="${pos[b][1]}"/>`).join("")}
        ${all.slice().reverse().map(node).join("")}
      </svg></div>
      <div class="maplegend">${nbs.map((id) => { const b = notebook(id); const i = db.notebooks.findIndex((x) => x.id === id);
        return `<span><i style="background:${b ? `hsl(${MAP_HUES[i % MAP_HUES.length]} 55% 50%)` : "var(--muted)"}"></i>${b ? esc(b.title) : "Notes without a notebook"}</span>`; }).join("")}</div>`;
    o.querySelector("#mapClose").onclick = closeMap;
    const mo = o.querySelector("#mapOpen"); if (mo) mo.onclick = () => { closeMap(); openNote(cid); };
    o.querySelectorAll("[data-node]").forEach((g) => { g.onclick = () => draw(g.dataset.node); g.onkeydown = (e) => { if (e.key === "Enter") draw(g.dataset.node); }; });
  };
  draw(centerId);
}
function closeMap() { document.querySelectorAll(".mapview").forEach((m) => m.remove()); }

function render() { renderNav(); renderList(); renderEditor(); if (ui.custDraw) ui.custDraw(); if (typeof syncBack === "function") syncBack(); }

/* ---- actions ---- */
function newNote() {

  const n = { id: uid(), title: "", html: "", links: [], tags: ui.view === "tag" && ui.tagId ? [ui.tagId] : [], favorite: ui.view === "favorites", notebooks: nbs, created: Date.now(), edited: Date.now(), pinned: false, archived: false, trashed: false };

}
// A note left with no title and no text is discarded, so + then Back leaves nothing behind
function discardIfEmpty(id) {

}

function openNote(id) { if (ui.noteId && ui.noteId !== id) discardIfEmpty(ui.noteId); ui.noteId = id; document.body.classList.add("editing"); render(); }
function setTagHidden(id, hidden, quiet = false) {

  t.hidden = hidden; save(); render();
  if (!quiet) toast(hidden ? `#${t.title} hidden from All notes` : `#${t.title} is back on All notes`, { label: "Undo", run: () => setTagHidden(id, !hidden, true) });
}
function setHome(id, state, quiet = false) {

    { label: "Undo", run: () => setHome(id, !state, true) });

function toast(msg, action) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status");
  const span = document.createElement("span"); span.textContent = msg; t.appendChild(span);
  if (action) {
    const btn = document.createElement("button"); btn.className = "toastbtn"; btn.textContent = action.label;
    btn.onclick = () => { t.remove(); action.run(); }; t.appendChild(btn);
  }
  document.body.appendChild(t); setTimeout(() => t.remove(), action ? 5000 : 2400);
}
// keep the + button clear of the toast
new MutationObserver(() => document.body.classList.toggle("toasting", !!document.querySelector(".toast"))).observe(document.body, { childList: true });
// Drag a sheet down to close it (the grab handle means this works)
function swipeToClose(sheet, close) {
  if (!sheet) return;
  let y0 = null, dy = 0;
  sheet.addEventListener("pointerdown", (e) => { if (e.pointerType !== "touch" || sheet.scrollTop > 0) return; y0 = e.clientY; dy = 0; sheet.style.transition = "none"; });
  sheet.addEventListener("pointermove", (e) => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); if (dy > 4) sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; y0 = null; sheet.style.transition = "transform .15s"; if (dy > 90) close(); else sheet.style.transform = ""; };
  sheet.addEventListener("pointerup", end); sheet.addEventListener("pointercancel", end);
}
function closeMenus() { document.querySelectorAll(".menu, .menuguard, .sheetwrap").forEach((m) => m.remove()); }
function showMenu(anchor, items, title = "") {
  closeMenus();
  items = cleanSeps(items);
  if (innerWidth <= 680) return showSheet(items, title);
  // invisible layer under the menu: a tap outside only closes the menu,
  // it never reaches the note or notebook underneath
  const guard = document.createElement("div"); guard.className = "menuguard";
  guard.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); });
  guard.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); closeMenus(); });
  document.body.appendChild(guard);
  const m = document.createElement("div"); m.className = "menu"; m.setAttribute("role", "menu");
  m.innerHTML = (title ? `<div class="menutitle">${esc(title)}</div>` : "") + items.map((it, i) => it === "-" ? "<hr>" : `<button data-i="${i}" class="${it.danger ? "danger" : ""} ${it.disabled ? "off" : ""}" ${it.disabled ? `aria-disabled="true" title="${esc(it.disabled)}"` : ""} role="${it.checked !== undefined ? "menuitemcheckbox" : "menuitem"}" ${it.checked !== undefined ? `aria-checked="${!!it.checked}"` : ""}>${ic(it.icon)}<span>${esc(it.menuLabel || it.label)}</span>${it.checked ? `<span class="check">${ic("check", 'style="fill:var(--accentInk)"')}</span>` : ""}</button>`).join("");
  document.body.appendChild(m);
  const w = m.offsetWidth, h = m.offsetHeight;
  if (ui.menuAt) {
    const { x, y } = ui.menuAt;
    m.style.left = Math.max(12, Math.min(x, innerWidth - w - 12)) + "px";
    m.style.top = Math.max(12, y + h + 8 > innerHeight ? y - h : y) + "px";
  } else {
    const r = anchor.getBoundingClientRect();
    m.style.left = Math.max(12, Math.min(r.right - w, innerWidth - w - 12)) + "px";
    m.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(12, r.top - h - 4) : r.bottom + 4) + "px";
  }
  m.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => { const it = items[+b.dataset.i]; if (it.disabled) return toast(it.disabled); closeMenus(); it.run(); });
  m.querySelector("button")?.focus();
}
function cleanSeps(items) {
  const out = [];
  items.forEach((it) => { if (it === "-" && (!out.length || out[out.length - 1] === "-")) return; out.push(it); });
  while (out[out.length - 1] === "-") out.pop();
  return out;
}
// Phone: the same actions as a bottom sheet. Toggles become tiles on top, like Notesnook's properties sheet.
function showSheet(items, title) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const w = document.createElement("div"); w.className = "sheetwrap";
  const tiles = items.filter((it) => it !== "-" && it.quick);
  const rows = cleanSeps(items.filter((it) => it === "-" || !it.quick));
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title || "Options")}"><div class="grab"></div>
    ${title ? `<div class="sheettitle">${esc(title)}</div>` : ""}
    ${tiles.length ? `<div class="quick">${tiles.map((it) => `<button data-i="${items.indexOf(it)}" ${it.disabled ? 'class="off" aria-disabled="true"' : `aria-pressed="${!!it.checked}"`}>${ic(it.icon, it.tint && it.checked ? `style="fill:${it.tint}"` : "")}<span>${esc(it.short || it.label)}</span></button>`).join("")}</div>` : ""}
    ${rows.map((it) => it === "-" ? "<hr>" : `<button class="row ${it.danger ? "danger" : ""}" data-i="${items.indexOf(it)}">${ic(it.icon)}<span>${esc(it.label)}</span></button>`).join("")}
  </div>`;
  w.addEventListener("click", (e) => { if (e.target === w) closeMenus(); });
  document.body.appendChild(w);
  swipeToClose(w.querySelector(".sheet"), closeMenus);
  w.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => { const it = items[+b.dataset.i]; if (it.disabled) return toast(it.disabled); closeMenus(); it.run(); });
}

function noteActions(id) {
  return [
    { icon: "addnb", label: "Add to notebook", run: () => pickNotebooks(id) },
    { icon: "tag", label: "Add tags", run: () => pickTags(id) },
    { icon: "link", label: "Link note", run: () => connectDialog(id) }
  ];
}
function restoreNote(n) { n.trashed = false; save(); render(); toast("Note restored", { label: "Undo", run: () => { n.trashed = true; if (ui.noteId === n.id) ui.noteId = null; commit(); } }); }
function setFavorite(n, state) { n.favorite = state; commit(state ? "Added to favorites" : "Removed from favorites"); }
function noteMenu(id, anchor) {
  const n = db.notes.find((x) => x.id === id); if (!n) return;
  const name = n.title || "Untitled";
  if (n.trashed) {
    return showMenu(anchor, [
      { icon: "restore", label: "Restore", run: () => restoreNote(n) },
      "-",
      { icon: "delete", label: "Delete permanently", danger: true, run: () => confirmDialog("Delete permanently?", "This note cannot be recovered.", "Delete", () => { db.notes = db.notes.filter((x) => x.id !== id); db.notes.forEach((x) => x.links = x.links.filter((l) => l !== id)); if (ui.noteId === id) ui.noteId = null; commit("Note deleted"); }) }
    ], name);
  }
  showMenu(anchor, [
    pinTile(n, "Note"),
    { quick: true, icon: n.favorite ? "starfill" : "star", tint: "#e5a50a", label: n.favorite ? "Favorited" : "Favorite", menuLabel: "Favorite", checked: n.favorite, run: () => setFavorite(n, !n.favorite) },
    { quick: true, icon: "archive", label: n.archived ? "Archived" : "Archive", menuLabel: "Archive", checked: n.archived, run: () => {
      const was = n.archived; n.archived = !was; save(); render();
      toast(was ? "Note unarchived" : "Note archived", { label: "Undo", run: () => { n.archived = was; commit(); } });
    } },
    "-",
    ...noteActions(id),
    "-",
    { icon: "trash", label: "Move to trash", danger: true, run: () => {
      const wasPinned = n.pinned, wasOpen = ui.noteId === id;
      n.trashed = true; n.pinned = false; if (wasOpen) ui.noteId = null; save(); render();
      toast("Note moved to trash", { label: "Undo", run: () => { n.trashed = false; n.pinned = wasPinned; commit(); if (wasOpen) openNote(id); } });
    } }
  ], name);
}

function notebookMenu(id, anchor) {
  const b = notebook(id); if (!b) return;
  showMenu(anchor, [
    ...pageTiles({ pinObj: b, pinNoun: "Notebook", hideNb: b, homeKey: "notebook:" + id }),
    "-",
    { icon: "edit", label: "Edit notebook", run: () => editNotebook(id) },
    { icon: "sub", label: "Add sub-notebook", run: () => editNotebook(null, id) },
    "-",
    { icon: "trash", label: "Delete notebook", danger: true, run: () => confirmDialog(`Delete ${b.title}?`, deleteNbText(b), "Delete", () => {
      db.notebooks.forEach((c) => { if (c.parent === id) c.parent = b.parent; });
      db.notebooks = db.notebooks.filter((x) => x.id !== id);
      if (startScreen() === "notebook:" + id) db.settings.startScreen = "home";
      db.notes.forEach((n) => n.notebooks = n.notebooks.filter((x) => x !== id));
      if (ui.view === "notebook" && ui.notebookId === id) { ui.view = "notebooks"; ui.notebookId = null; }
      commit("Notebook deleted");
    }) }
  ], b.title);
}
function comesBack(n, without) {
  // would this note show on All notes once `without` (a notebook or tag id) is gone?
  if (!homeOn() || onHomepage(n)) return false;
  if (n.tags.some((id) => id !== without && tagById(id)?.hidden)) return false;
  const nbs = n.notebooks.filter((id) => id !== without).map(notebook).filter(Boolean);
  return nbs.length === 0 || nbs.some((x) => x.showOnHomepage !== false);
}
function deleteNbText(b) {
  const back = liveNotes().filter((n) => !n.archived && n.notebooks.includes(b.id) && comesBack(n, b.id)).length;
  return ["Its notes are kept.", children(b.id).length ? "Sub-notebooks move up one level." : "", back ? `${plural(back, "hidden note")} will show on All notes again.` : "",
    startScreen() === "notebook:" + b.id ? "It is your homepage, so All notes becomes your homepage again." : ""].filter(Boolean).join(" ");
}
function trashMenu(anchor) {
  const n = db.notes.filter((x) => x.trashed).length;
  showMenu(anchor, [
    { icon: "delete", label: `Empty trash (${plural(n, "note")})`, danger: true, run: () => emptyTrash() }
  ], "Trash");
}
function emptyTrash() {
  confirmDialog("Empty trash?", "Notes in the trash are deleted for good.", "Empty trash", () => { db.notes = db.notes.filter((n) => !n.trashed); const ids = new Set(db.notes.map((n) => n.id)); db.notes.forEach((n) => n.links = n.links.filter((l) => ids.has(l))); if (ui.noteId && !db.notes.find((n) => n.id === ui.noteId)) ui.noteId = null; commit("Trash emptied"); });
}

function dialog(html, onReady) {
  const o = document.createElement("div"); o.className = "overlay";
  o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.addEventListener("click", (e) => { if (e.target === o) close(); });
  o.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } });
  onReady(o, close);
  setTimeout(() => o.querySelector("input,button")?.focus(), 30);
}
function confirmDialog(title, text, okLabel, onOk) {
  dialog(`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`, (o, close) => {
    o.querySelector("[data-x]").onclick = close;
    o.querySelector("[data-ok]").onclick = () => { close(); onOk(); };
  });
}
function editNotebook(id, parentId = null) {
  const b = id ? notebook(id) : null;
  const parent = parentId ? notebook(parentId) : null;
  dialog(`
    <h2>${b ? "Edit notebook" : parent ? `New sub-notebook in ${esc(parent.title)}` : "New notebook"}</h2>
    <label class="field">Title<input id="nbTitle" value="${esc(b?.title || "")}" placeholder="Notebook title"></label>
    <label class="field">Description<input id="nbDesc" value="${esc(b?.description || "")}" placeholder="Optional"></label>
    ${homeOn() ? `    <div class="setrow"><div><b>${hideLabel()}</b><p>Its notes stay off All notes unless they are also in a shown notebook. Sub-notebooks are set on their own.</p></div><label class="switch"><input type="checkbox" id="nbHome" ${(b ? b.showOnHomepage === false : parent?.showOnHomepage === false) ? "checked" : ""} aria-label="${hideLabel()}"><span></span></label></div>` : ""}
    <div class="actions"><button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>${b ? "Save" : "Create"}</button></div>`, (o, close) => {
    const submit = () => {
      const title = o.querySelector("#nbTitle").value.trim();
      if (!title) { o.querySelector("#nbTitle").focus(); toast("Notebook needs a title"); return; }
      const desc = o.querySelector("#nbDesc").value.trim();
      const homeEl = o.querySelector("#nbHome");
      const home = homeEl ? !homeEl.checked : (b ? b.showOnHomepage !== false : true);
      const hideChanged = b && (b.showOnHomepage !== false) !== home;
      if (b) { b.title = title; b.description = desc; b.showOnHomepage = home; }
      else db.notebooks.push({ id: uid(), title, description: desc, parent: parentId, showOnHomepage: home, created: Date.now() });
      close(); commit(b ? (hideChanged ? `Notebook saved. ${home ? "Back on " + hideTarget() : hideLabel(true)}` : "Notebook saved") : "Notebook created");
    };
    o.querySelector("[data-x]").onclick = close;
    o.querySelector("[data-ok]").onclick = submit;
    o.querySelector("#nbTitle").onkeydown = (e) => { if (e.key === "Enter") submit(); };
  });
}
function pickNotebooks(noteId) {
  const n = db.notes.find((x) => x.id === noteId);
  const prev = n.notebooks.slice(), before = prev.length;
  panel("Add to notebook", `
    <h2 class="ptitle">Add to notebook</h2>
    ${homeOn() ? `<p class="phint">A note in several notebooks shows on ${homeLabel()} if one of them is not hidden.</p>` : ""}
    <div class="connlist">${rootsOrdered().map(({ b, depth }) => `<label class="checkrow ${depth ? "child" : ""}"><input type="checkbox" value="${b.id}" ${n.notebooks.includes(b.id) ? "checked" : ""}>${ic("notebook")}<span>${esc(b.title)}</span>${hiddenNb(b) ? `<span class="mark" title="${hideLabel(true)}">${ic("eyeoff")}</span>` : ""}</label>`).join("") || `<p class="connempty">No notebooks yet.</p>`}</div>
    <div class="actions"><button class="btn primary" data-x>Done</button></div>`, (o, close) => {
    o.querySelectorAll("input[type=checkbox]").forEach((c) => c.onchange = () => {
      n.notebooks = c.checked ? [...n.notebooks, c.value] : n.notebooks.filter((x) => x !== c.value); save(); render();
    });
    const done = () => {
      close();
      if (prev.slice().sort().join() === n.notebooks.slice().sort().join()) return;
      const names = n.notebooks.map((id) => notebook(id)?.title).filter(Boolean).join(", ");
      toast(!n.notebooks.length ? "Moved to Notes without a notebook"
        : n.notebooks.every((id) => notebook(id)?.showOnHomepage === false) && homeOn() ? `Added to ${names}, which is hidden from All notes`
        : before === 0 ? `Filed in ${names}` : "Notebooks updated", { label: "Undo", run: () => { n.notebooks = prev; commit(); } });
    };
    o.querySelector("[data-x]").onclick = done;
    o.onPanelClose = done;
  });
}

// One extra history step stands in for "something is open". Back closes the top layer:
// map > dialog or sheet > open note (phone) > drawer > Hidden notes > any page other than the homepage.
const isPhone = () => innerWidth <= 680;
function topLayer() {
  const ov = [...document.querySelectorAll(".overlay, .sheetwrap")].pop();
  if (document.querySelector(".mapview")) return () => closeMap();
  if (ov) return () => (ov._dismiss ? ov._dismiss() : (ov.classList.contains("sheetwrap") ? closeMenus() : ov.remove()));
  if (document.querySelector(".menu")) return () => closeMenus();
  if (isPhone() && document.body.classList.contains("editing")) return () => closeEditor();
  if (document.body.classList.contains("drawer")) return () => document.body.classList.remove("drawer");
  if (ui.view === "hidden") return () => setView("home");
  if (viewKey() !== startScreen()) return () => { openStartScreen(); render(); };
  return null;
}
let guarded = false;
function syncBack() { if (!guarded && topLayer()) { try { history.pushState({ nn: 1 }, ""); guarded = true; } catch (e) {} } }
addEventListener("popstate", () => {
  guarded = false;
  const close = topLayer();
  if (close) { close(); syncBack(); } else { try { history.back(); } catch (e) {} }
});
new MutationObserver(syncBack).observe(document.body, { childList: true, attributes: true, attributeFilter: ["class"] });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || e.defaultPrevented) return;
  if (document.querySelector(".mapview")) return closeMap();
  const ov = [...document.querySelectorAll(".overlay, .sheetwrap")].pop();
  if (ov) return ov._dismiss ? ov._dismiss() : ov.classList.contains("sheetwrap") ? closeMenus() : ov.remove();
  if (document.querySelector(".menu")) return closeMenus();
  if (isPhone() && document.body.classList.contains("editing")) return closeEditor();
  if (document.body.classList.contains("drawer")) document.body.classList.remove("drawer");
});
document.getElementById("scrim").onclick = () => document.body.classList.remove("drawer");
applyTheme();
openStartScreen();
render();
</script>
